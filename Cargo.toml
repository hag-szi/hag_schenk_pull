[package]
name = "hag-schenk-pull"
version = "0.1.0"
edition = "2021"
authors = ["IT Hartmann <it@hartmannag.de>"]
description = "Pollt die Legacy-Postgres auf neue Schenk-Avise und publisht sie als hag.events.schenk.lager.avise.received an den HAG-Connect-NATS-Bus."

[[bin]]
name = "hag-schenk-pull"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Postgres
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "macros",
] }

# NATS (mit JetStream-Publish, Server-seitiges Dedup via Nats-Msg-Id)
async-nats = "0.42"
bytes = "1"
futures = "0.3"

# Serde + JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
