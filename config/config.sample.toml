# Sample-Konfig für hag-schenk-pull.
# Kopiere nach `config/config.toml` und trage die Credentials ein;
# die echte config.toml steht in .gitignore.
#
# Sensible Werte gehen besser per Env-Variable — figment zieht
# `HAG_SCHENK_PULL__`-präfixierte Vars mit `__` als Sektions-
# Separator, z.B.
#   HAG_SCHENK_PULL__POSTGRES__URL=postgres://...
#   HAG_SCHENK_PULL__NATS__USERNAME=svc-hag-schenk-pull-dev
#   HAG_SCHENK_PULL__NATS__PASSWORD=...

[logging]
dir   = "logs"
level = "info"

[postgres]
# Zugang läuft in Prod über einen systemd-verwalteten autossh-Tunnel;
# die URL zeigt deshalb auf den Loopback-Port.
url        = "postgres://DB_USER:DB_PASSWORD@127.0.0.1:5433/DB_NAME?sslmode=disable"
lngroot_id = 999
lngprod_id = 520
# Wenn true: keine `UPDATE strlocked='N'`-Writes. Nur Dev; Publisher
# wird dieselben Avise endlos erneut senden (Consumer ist idempotent).
read_only  = true

[nats]
url           = "nats://192.168.4.128:4222"
username      = "svc-hag-schenk-pull-dev"
password      = "CHANGEME"
# `dev`/`test`/`prod` — wird als zweites Subject-Segment eingefügt
# (`hag.<env>.events.…`), spiegelt subject_suffix_for(env) im
# Plattform-`declare_topology.py`.
env           = "dev"
producer_name = "hag-schenk-pull"
customer_key  = "SCHENK"

[pull]
# Sekunden zwischen zwei Pulls. 60 entspricht der alten Lobster-
# Taktung im abgelösten schenk_we_export.
interval_seconds = 60
